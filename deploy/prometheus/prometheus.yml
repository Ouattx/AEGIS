# Prometheus for the AEGIS OMEGA SHIELD single-host deployment (monitoring profile).
# AEGIS metric labels never carry tenant ids, subjects, pseudonyms or indicators.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    deployment: aegis-shield

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: aegis-api
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      # written to tmpfs from AEGIS_METRICS_TOKEN by the container entrypoint
      credentials_file: /tmp/aegis_metrics_token
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: aegis-api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
