# Continuous integration for AEGIS OMEGA SHIELD.
#
# Gates (all required on pull requests):
#   lint       ruff (correctness rule set in pyproject.toml)
#   test       full pytest suite incl. spec section 15 safety tests; ledger tests also on PostgreSQL
#   web        console type-check, unit tests and production build
#   audit      pip-audit of the shipped Python environment, npm audit of shipped console packages
#   sbom       CycloneDX SBOMs (Python environment + console) as build artifacts
#   deploy     compose files, Prometheus config/rules (promtool) and shell scripts
#   container  image build, non-root/read-only run check, compose end-to-end smoke test,
#              CycloneDX SBOM of the image (syft)
#
# Third-party actions are referenced by major version; pin them to commit SHAs in the
# organisation's fork/allow-list policy before production use.
name: ci

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install "ruff==0.16.9"
      - run: ruff check --output-format=github .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis-ci
          POSTGRES_DB: aegis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      AEGIS_TEST_POSTGRES_URL: postgresql+psycopg://aegis:aegis-ci@localhost:5432/aegis_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,postgres,llm]"
      - name: Safety tests (spec section 15)
        run: python -m pytest -q -m safety
      - name: Full suite
        run: python -m pytest -q --junitxml=pytest-${{ matrix.python-version }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-${{ matrix.python-version }}
          path: pytest-${{ matrix.python-version }}.xml

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the shipped Python environment
        run: |
          python -m venv /tmp/app
          /tmp/app/bin/pip install ".[postgres,llm]"
          python -m pip install "pip-audit>=2.7"
      - name: pip-audit (fails on any known vulnerability)
        run: |
          SITE=$(/tmp/app/bin/python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
          pip-audit --path "$SITE" --desc on
      - name: npm audit (shipped console dependencies, high and critical)
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
      - name: npm audit (development toolchain, report only)
        working-directory: web
        run: npm audit || true

  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Python environment SBOM (CycloneDX)
        run: |
          python -m venv /tmp/app
          /tmp/app/bin/pip install ".[postgres,llm]"
          python -m pip install "cyclonedx-bom>=4"
          mkdir -p dist
          cyclonedx-py environment --output-format JSON --output-file dist/sbom-python.cdx.json /tmp/app/bin/python
      - name: Console SBOM (CycloneDX)
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm sbom --omit=dev --sbom-format cyclonedx > ../dist/sbom-web.cdx.json
      - name: Validate SBOMs are non-empty CycloneDX
        run: |
          python - <<'PY'
          import json
          for f in ("dist/sbom-python.cdx.json", "dist/sbom-web.cdx.json"):
              d = json.load(open(f))
              assert d["bomFormat"] == "CycloneDX" and d.get("components"), f
              print(f, d["specVersion"], len(d["components"]), "components")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-source
          path: dist/*.cdx.json

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compose files are valid
        run: |
          sed -e 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci/' \
              -e 's/^AEGIS_PSEUDONYM_MASTER_KEY=.*/AEGIS_PSEUDONYM_MASTER_KEY=00112233445566778899aabbccddeeff/' \
              -e 's/^AEGIS_METRICS_TOKEN=.*/AEGIS_METRICS_TOKEN=ci/' \
              -e 's/^GRAFANA_ADMIN_PASSWORD=.*/GRAFANA_ADMIN_PASSWORD=ci/' deploy/.env.example > /tmp/ci.env
          docker compose -f deploy/docker-compose.yml --env-file /tmp/ci.env --profile monitoring --profile bus config -q
          docker compose -f deploy/docker-compose.demo.yml config -q
      - name: Prometheus configuration and alert rules (promtool)
        run: |
          docker run --rm --entrypoint /bin/sh -v "$PWD/deploy/prometheus:/etc/prometheus:ro" prom/prometheus:v3.5.0 \
            -c 'echo ci > /tmp/aegis_metrics_token && promtool check config /etc/prometheus/prometheus.yml && promtool test rules /etc/prometheus/tests/*.yml'
      - name: Shell scripts (shellcheck)
        run: shellcheck deploy/*.sh

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: aegis-omega:ci
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image runs as non-root with a read-only root file system
        run: |
          test "$(docker run --rm --entrypoint id aegis-omega:ci -u)" = "10001"
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint python aegis-omega:ci -c "from aegis.sentinel.model import load_default; print(load_default().model_id)"
      - name: Compose end-to-end smoke test (PostgreSQL, API, Prometheus)
        run: AEGIS_IMAGE=aegis-omega:ci NO_BUILD=1 deploy/smoke-test.sh
      - name: Image SBOM (CycloneDX, syft)
        uses: anchore/sbom-action@v0
        with:
          image: aegis-omega:ci
          format: cyclonedx-json
          output-file: sbom-image.cdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-image
          path: sbom-image.cdx.json
