[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-omega"
version = "1.0.0"
description = "AEGIS OMEGA SHIELD: evidence-first network and device security intelligence for operators"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "cryptography>=42",
  "pyjwt>=2.8",
  "rfc8785>=0.1.2",
  "jinja2>=3.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
postgres = ["psycopg[binary]>=3.1"]
kafka = ["confluent-kafka>=2.3"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.setuptools.package-data]
"aegis.reports" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["safety: spec section 15 mandatory safety tests"]
